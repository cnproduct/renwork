name: renwork-account

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  mysql:
    <<: *service-defaults
    image: mysql:8.4
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=768M
      - --max-connections=80
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: renwork_den
      MYSQL_USER: renwork_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ./data/account-mysql:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1200M
          cpus: "0.75"

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ./data/account-redis:/data
    deploy:
      resources:
        limits:
          memory: 224M
          cpus: "0.20"

  den-api:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.den
      args:
        DEN_API_VERSION: ${RENWORK_RELEASE_VERSION:-production}
    command:
      - sh
      - -lc
      - cd /app/ee/packages/den-db && pnpm run db:migrate && exec node /app/ee/apps/den-api/dist/main.js
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=640
      PORT: "8788"
      DATABASE_URL: mysql://renwork_user:${DB_PASSWORD}@mysql:3306/renwork_den
      DATABASE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_REDIS_ALLOW_INSECURE_INTERNAL: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      DEN_DB_ENCRYPTION_KEY: ${DEN_DB_ENCRYPTION_KEY:?set DEN_DB_ENCRYPTION_KEY}
      BETTER_AUTH_URL: https://account.rrenn.com
      DEN_BETTER_AUTH_TRUSTED_ORIGINS: https://account.rrenn.com
      DEN_API_PUBLIC_URL: https://account.rrenn.com/api/den
      DEN_DESKTOP_DEN_BASE_URL: https://account.rrenn.com/api/den
      DEN_MARKETING_URL: https://www.rrenn.com
      DEN_MCP_RESOURCE_URL: https://account.rrenn.com/api/den/mcp
      CORS_ORIGINS: https://account.rrenn.com
      OPENWORK_DEV_MODE: "0"
      DEN_ORG_MODE: multi_org
      DEN_REQUIRE_EMAIL_VERIFICATION: "true"
      DEN_OBSERVABILITY_BACKEND: none
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      RENWORK_BUYER_PROVIDER_MODE: ${RENWORK_BUYER_PROVIDER_MODE:-disabled}
      RENWORK_HUNTER_API_KEY: ${RENWORK_HUNTER_API_KEY:-}
      RENWORK_HUNTER_ALLOWED_ORG_ID: ${RENWORK_HUNTER_ALLOWED_ORG_ID:-}
      RENWORK_HUNTER_OFFICIAL_POOL_LICENSED: ${RENWORK_HUNTER_OFFICIAL_POOL_LICENSED:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    ports:
      - 127.0.0.1:8790:8788
    deploy:
      resources:
        limits:
          memory: 850M
          cpus: "0.75"

  den-web:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.den-web
    depends_on:
      den-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3005"
      DEN_API_BASE: http://den-api:8788
      DEN_AUTH_FALLBACK_BASE: http://den-api:8788
      DEN_AUTH_ORIGIN: https://account.rrenn.com
      DEN_WEB_PUBLIC_ORIGIN: https://account.rrenn.com
      DEN_WEB_OPENWORK_AUTH_CALLBACK_URL: https://account.rrenn.com
      DEN_WEB_OPENWORK_APP_CONNECT_URL: renwork://open
      DEN_WEB_OPENWORK_WEB_URL: https://account.rrenn.com
      DEN_ORG_MODE: multi_org
      DEN_REQUIRE_EMAIL_VERIFICATION: "true"
      OPENWORK_DEV_MODE: "0"
      DEN_OBSERVABILITY_BACKEND: none
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/ready').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    ports:
      - 127.0.0.1:3005:3005
    deploy:
      resources:
        limits:
          memory: 650M
          cpus: "0.55"
