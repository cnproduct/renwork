map $http_upgrade $renwork_connection_upgrade {
    default upgrade;
    "" close;
}
limit_req_zone $binary_remote_addr zone=renwork_account_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name account.rrenn.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name account.rrenn.com;

    ssl_certificate /etc/letsencrypt/live/account.rrenn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.rrenn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RenWorkTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location /api/ {
        limit_req zone=renwork_account_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $renwork_connection_upgrade;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $renwork_connection_upgrade;
        proxy_read_timeout 180s;
    }
}
