name: renwork-auth

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --performance_schema=OFF
      - --innodb-buffer-pool-size=192M
      - --innodb-log-buffer-size=16M
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: renwork_den
      MYSQL_USER: renwork
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  den:
    image: ${RENWORK_DEN_IMAGE:?Set RENWORK_DEN_IMAGE to the release-tagged Den image}
    restart: unless-stopped
    network_mode: service:catalog
    depends_on:
      mysql:
        condition: service_healthy
      catalog:
        condition: service_healthy
    command: ["node", "/app/ee/apps/den-api/dist/main.js"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --conditions=production
      PORT: "8788"
      DATABASE_URL: mysql://renwork:${MYSQL_PASSWORD}@mysql:3306/renwork_den
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://www.rrenn.com
      DEN_DB_ENCRYPTION_KEY: ${DEN_DB_ENCRYPTION_KEY}
      DEN_ORG_MODE: multi_org
      DEN_SINGLE_ORG_NAME: RenWork
      DEN_SINGLE_ORG_SLUG: renwork
      DEN_REQUIRE_EMAIL_VERIFICATION: ${DEN_REQUIRE_EMAIL_VERIFICATION:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEN_BOOTSTRAP_ADMIN_EMAILS: ${DEN_BOOTSTRAP_ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      DEN_API_PUBLIC_URL: https://www.rrenn.com/api/den
      DEN_MCP_RESOURCE_URL: https://www.rrenn.com/api/den/mcp
      DEN_BETTER_AUTH_TRUSTED_ORIGINS: https://www.rrenn.com,https://rrenn.com
      CORS_ORIGINS: https://www.rrenn.com,https://rrenn.com
      PROVISIONER_MODE: stub
      DEN_OBSERVABILITY_BACKEND: none
      RENWORK_MODEL_CATALOG_BASE_URL: http://127.0.0.1:8089
      RENWORK_MODEL_CATALOG_ADMIN_TOKEN: ${RENWORK_SUPER_ADMIN_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      OPENROUTER_MANAGEMENT_API_KEY: ${OPENROUTER_MANAGEMENT_API_KEY:-}
      OPENROUTER_WORKSPACE_ID: ${OPENROUTER_WORKSPACE_ID:-}
      INFERENCE_PROXY_BASE_URL: https://www.rrenn.com/api/den
      RENCREDIT_RESERVATION_SWEEP_INTERVAL_MS: "60000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  catalog:
    image: ${RENWORK_DEN_IMAGE:?Set RENWORK_DEN_IMAGE to the release-tagged Den image}
    restart: unless-stopped
    command: ["node", "/app/deploy/cloud-api-server/dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: "8089"
      RENWORK_SUPER_ADMIN_TOKEN: ${RENWORK_SUPER_ADMIN_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      DATA_PATH: /data/catalog-state.json
    volumes:
      - /opt/renwork-auth/catalog-data:/data
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8089/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    image: ${RENWORK_WEB_IMAGE:?Set RENWORK_WEB_IMAGE to the release-tagged Den Web image}
    restart: unless-stopped
    depends_on:
      den:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      PORT: "3005"
      DEN_API_BASE: http://catalog:8788
      DEN_AUTH_FALLBACK_BASE: http://catalog:8788
      DEN_AUTH_ORIGIN: https://www.rrenn.com
      DEN_WEB_PUBLIC_ORIGIN: https://www.rrenn.com
      DEN_WEB_OPENWORK_AUTH_CALLBACK_URL: https://www.rrenn.com
      DEN_WEB_OPENWORK_WEB_URL: https://www.rrenn.com
      DEN_ORG_MODE: multi_org
      DEN_SINGLE_ORG_NAME: RenWork
      DEN_SINGLE_ORG_SLUG: renwork
      DEN_WEB_GOOGLE_AUTH_ENABLED: ${DEN_WEB_GOOGLE_AUTH_ENABLED:-false}
      DEN_WEB_GITHUB_AUTH_ENABLED: ${DEN_WEB_GITHUB_AUTH_ENABLED:-false}
      DEN_OBSERVABILITY_BACKEND: none
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  mysql-data:
