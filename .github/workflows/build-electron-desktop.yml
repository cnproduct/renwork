name: Build Electron Desktop (RenWork)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - apps/app/**
      - apps/desktop/**
      - packages/ui/**
      - constants.json
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-electron-desktop.yml

permissions:
  contents: write

jobs:
  build-electron:
    name: Build RenWork (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            target: --mac dmg zip
          - os: ubuntu-latest
            artifact: linux
            target: --linux AppImage tar.gz
          - os: windows-latest
            artifact: windows
            target: --win nsis zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron Desktop Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          OPENWORK_DESKTOP_SENTRY_DSN: ""
          OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: "0.01"
        run: |
          pnpm --filter @openwork/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never

      - name: Upload RenWork Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renwork-desktop-${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.tar.gz
            apps/desktop/dist-electron/*.zip
          if-no-files-found: warn
