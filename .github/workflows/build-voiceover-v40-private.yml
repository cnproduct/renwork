name: Build Voiceover V40 private desktop candidates

on:
  workflow_dispatch:
  push:
    branches:
      - fix/voiceover-v40-desktop-candidates

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            command: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --arm64 --publish never
            output: apps/desktop/dist-electron
            artifact: RenWork-V40-macOS-arm64
          - name: macOS x64
            os: macos-14
            command: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --x64 --publish never
            output: apps/desktop/dist-electron
            artifact: RenWork-V40-macOS-x64
          - name: Windows x64
            os: windows-2022
            command: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis zip --x64 --publish never
            output: apps/desktop/dist-electron
            artifact: RenWork-V40-Windows-x64
          - name: Windows Server 2016 cloud x64
            os: windows-2022
            command: pnpm --dir apps/desktop exec electron-builder --config electron-builder.server2016-cloud.yml --win nsis zip --x64 --publish never
            output: apps/desktop/dist-electron-server2016-cloud
            artifact: RenWork-V40-Windows-Server-2016-Cloud-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/app exec bun test src/react-app/domains/connections/provider-auth/provider-policy.test.ts src/react-app/kernel/den-only-model-migration.test.ts
      - run: pnpm --filter @openwork/desktop run build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          OPENWORK_DESKTOP_SENTRY_DSN: ""
          OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: "0.01"
      - name: Package private candidate
        shell: bash
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify Den-only package
        shell: bash
        run: |
          if find "${{ matrix.output }}" -type f \( -iname 'opencode.exe' -o -iname 'opencode-*' \) | grep -q .; then
            echo "Den-only package contains a forbidden OpenCode sidecar" >&2
            exit 1
          fi
      - name: Write checksums
        shell: bash
        run: |
          find "${{ matrix.output }}" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 |
            sort -z | xargs -0 shasum -a 256 > "${{ matrix.output }}/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}/*.dmg
            ${{ matrix.output }}/*.zip
            ${{ matrix.output }}/*.exe
            ${{ matrix.output }}/SHA256SUMS.txt
          if-no-files-found: error
