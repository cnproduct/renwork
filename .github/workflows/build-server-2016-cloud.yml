name: Build Windows Server 2016 Cloud Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - feat/server-2016-cloud-mode
    paths:
      - apps/app/**
      - apps/desktop/**
      - packages/types/**
      - packages/ui/**
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-server-2016-cloud.yml

permissions:
  contents: read

jobs:
  build-server-2016-cloud:
    name: Build Server 2016 cloud-only x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Server 2016 distribution tests
        run: pnpm --dir apps/desktop exec node --test electron/desktop-distribution.test.mjs electron/electron-builder-config.test.mjs

      - name: Build cloud-only desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          OPENWORK_DESKTOP_SENTRY_DSN: ""
          OPENWORK_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: "0.01"
        run: |
          pnpm --filter @openwork/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.server2016-cloud.yml --win nsis zip --x64 --publish never

      - name: Verify the package does not ship OpenCode sidecars
        shell: pwsh
        run: |
          $sidecars = Get-ChildItem -Path apps/desktop/dist-electron-server2016-cloud -Recurse -Filter 'opencode*.exe' -ErrorAction SilentlyContinue
          if ($sidecars) { throw "Server 2016 cloud package must not contain OpenCode sidecars: $($sidecars.FullName -join ', ')" }

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/dist-electron-server2016-cloud -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content apps/desktop/dist-electron-server2016-cloud/SHA256SUMS.txt

      - name: Upload Server 2016 test package
        uses: actions/upload-artifact@v4
        with:
          name: RenWork-v0.18.58-Windows-Server-2016-Cloud-x64
          path: |
            apps/desktop/dist-electron-server2016-cloud/*.exe
            apps/desktop/dist-electron-server2016-cloud/*.zip
            apps/desktop/dist-electron-server2016-cloud/SHA256SUMS.txt
          if-no-files-found: error
