<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="renGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="520" height="120" rx="16" fill="#0B0F19"/>

  <!-- Iconic Logo Mark: Dynamic R/N Global Growth Wings -->
  <g transform="translate(24, 20)">
    <!-- Left Wing Arc -->
    <path d="M 20 65 L 40 15 C 44 8, 56 8, 60 15 L 80 65 C 83 72, 75 78, 68 73 L 50 60 L 32 73 C 25 78, 17 72, 20 65 Z" fill="url(#renGradient)" filter="url(#glow)"/>
    <!-- Right Tech Node Arc -->
    <circle cx="50" cy="36" r="8" fill="#FFFFFF"/>
    <path d="M 38 48 C 45 42, 55 42, 62 48" stroke="#0B0F19" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Accent Sparkle -->
    <polygon points="72,18 75,26 83,29 75,32 72,40 69,32 61,29 69,26" fill="#38BDF8"/>
  </g>

  <!-- Brand Name Text: 人人易 AI -->
  <text x="125" y="62" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="1">人人易 <tspan fill="url(#renGradient)">AI</tspan></text>

  <!-- Tagline / Subtitle -->
  <text x="127" y="90" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" font-size="15" fill="#94A3B8" letter-spacing="2">AI外贸增长操作系统</text>

  <!-- Domain Pill Badge -->
  <g transform="translate(385, 45)">
    <rect width="110" height="30" rx="15" fill="none" stroke="url(#cyanGradient)" stroke-width="1.5"/>
    <text x="55" y="20" font-family="sans-serif" font-weight="700" font-size="13" fill="#38BDF8" text-anchor="middle">rrenn.com</text>
  </g>
</svg>
